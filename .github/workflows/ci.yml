name: CI

# Runs on every pull request, and on pushes to master (merges included).
# Feature-branch pushes aren't run on their own: once a PR is open each push
# would otherwise run everything twice, once per event.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes the running check, except on
# master, where every commit that reaches production is verified to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # The API URL is baked into the client bundle at build time; CI only
      # checks that the app builds, so a placeholder is enough.
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
        run: npm run build
